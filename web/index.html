<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="jobmate">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>jobmate</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #F8FAFC; }
    #jobmate-loading { position: fixed; inset: 0; display: grid; place-content: center;
      text-align: center; font-family: system-ui, sans-serif; color: #0F172A; }
    #jobmate-loading h1 { color: #0F766E; font-size: 28px; }
    #jobmate-loading p { color: #64748B; padding: 0 24px; }
    #jobmate-loading button { padding: 12px 24px; border: 0; border-radius: 12px;
      background: #0D9488; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <div id="jobmate-loading" role="status" aria-live="polite">
    <h1>JobMate</h1>
    <p id="jobmate-startup-message">Loading JobMate…</p>
    <button id="jobmate-reload" hidden onclick="window.location.reload()">Reload</button>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async onerror="document.getElementById('jobmate-startup-message').textContent='Unable to load JobMate. Check your connection and reload.'; document.getElementById('jobmate-reload').hidden=false;"></script>
</body>
</html>
